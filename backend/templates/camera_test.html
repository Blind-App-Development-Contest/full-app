<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>웹캠 실시간 객체 탐지 테스트</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        #container { position: relative; margin-top: 20px; }
        #video { border: 1px solid black; }
        #canvas { position: absolute; top: 0; left: 0; }
        #controls { margin-top: 10px; }
        #status { margin-top: 10px; font-size: 14px; color: #333; }
    </style>
</head>
<body>
    <h1>웹캠 실시간 객체 탐지 테스트</h1>
    <div id="controls">
        <label for="user_id">User ID:</label>
        <input type="text" id="user_id" placeholder="DB에 있는 유효한 UUID 입력">
        <button id="startBtn">테스트 시작</button>
        <button id="stopBtn" disabled>중지</button>
        <button id="describeBtn" disabled>화면 설명</button>
    </div>
    <div id="status">상태: 대기 중</div>
    <div id="threat_level_display">현재 위험도: -</div>
    <div id="container">
        <video id="video" width="640" height="480" autoplay muted playsinline></video>
        <canvas id="canvas" width="640" height="480"></canvas>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const describeBtn = document.getElementById('describeBtn');
        const userIdInput = document.getElementById('user_id');
        const statusDiv = document.getElementById('status');

        let websocket;
        let stream;
        let intervalId;

        // --- WebSocket 및 스트리밍 로직 ---
        async function startStreaming() {
            const userId = userIdInput.value.trim();
            if (!userId) {
                alert('User ID를 입력하세요.');
                return;
            }

            // 1. 웹캠 스트림 가져오기
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                statusDiv.textContent = '상태: 웹캠 로드 완료. WebSocket 연결 중...';
            } catch (err) {
                console.error("웹캠 접근 에러:", err);
                statusDiv.textContent = '에러: 웹캠에 접근할 수 없습니다.';
                return;
            }

            // 2. WebSocket 연결
            const wsUrl = `ws://${window.location.host}/api/camera/stream/${userId}`;
            websocket = new WebSocket(wsUrl);

            websocket.onopen = () => {
                console.log("WebSocket 연결 성공");
                statusDiv.textContent = '상태: 연결됨. 실시간 탐지 중...';
                startBtn.disabled = true;
                stopBtn.disabled = false;
                describeBtn.disabled = false;

                // 3. 적응형 프레임 전송 (배터리 효율성 + 정확도)
                let frameInterval = 400; // 기본 400ms (배터리 절약)
                let measurementMode = false;
                let consecutiveDetections = 0;
                
                const adaptiveFrameSending = () => {
                    sendFrame();
                    
                    // 프레임 간격 동적 조정
                    setTimeout(() => {
                        if (measurementMode) {
                            frameInterval = Math.max(100, frameInterval - 10); // 측정 중엔 점진적으로 빨라짐 (최대 100ms)
                        } else {
                            frameInterval = Math.min(500, frameInterval + 20); // 대기 중엔 점진적으로 느려짐 (최대 500ms)
                        }
                        adaptiveFrameSending();
                    }, frameInterval);
                };
                
                adaptiveFrameSending();
            };

            websocket.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.status === 'error') {
                    console.error("서버 에러:", data.message);
                    statusDiv.textContent = `서버 에러: ${data.message}`;
                    return;
                }

                if (data.type === 'object_list') {
                    const objectList = data.objects.length > 0 ? data.objects.join(', ') : '없음';
                    alert(`탐지된 객체 목록: ${objectList}`);
                    statusDiv.textContent = '상태: 객체 목록을 받았습니다.';
                    setTimeout(() => {
                        if (websocket && websocket.readyState === WebSocket.OPEN) {
                            statusDiv.textContent = '상태: 연결됨. 실시간 탐지 중...';
                        }
                    }, 2000);

                } else if (data.type === 'threat_detection') {
                    if (data.objects) {
                        drawDetections(data.objects);
                    }
                    
                    // 측정 모드 감지 및 적응형 프레임률 조정
                    if (data.mode === 'measurement') {
                        measurementMode = true;
                        if (data.measurement && data.measurement.success) {
                            statusDiv.textContent = `보폭 측정: ${data.measurement.step_length_cm}cm (신뢰도: ${(data.measurement.confidence * 100).toFixed(1)}%)`;
                            consecutiveDetections++;
                        } else {
                            statusDiv.textContent = '보폭 측정 중... 발 위치를 감지하고 있습니다.';
                        }
                    } else {
                        measurementMode = false;
                        consecutiveDetections = 0;
                        
                        if (data.vibration) {
                            statusDiv.textContent = `상태: [${data.vibration.pattern_type.toUpperCase()}] ${data.vibration.reason}`;
                            if ('vibrate' in navigator) {
                                navigator.vibrate(data.vibration.duration_ms);
                            }
                        } else {
                            statusDiv.textContent = '상태: 연결됨. 실시간 탐지 중...';
                        }
                    }

                    const threatLevelDisplay = document.getElementById('threat_level_display');
                    if (data.highest_threat_level !== undefined) {
                        threatLevelDisplay.textContent = `현재 위험도: ${data.highest_threat_level}`;
                    } else {
                        threatLevelDisplay.textContent = `현재 위험도: -`;
                    }
                }
            };

            websocket.onclose = () => {
                console.log("WebSocket 연결 종료");
                statusDiv.textContent = '상태: 연결 종료됨.';
                stopStreaming();
            };

            websocket.onerror = (err) => {
                console.error("WebSocket 에러:", err);
                statusDiv.textContent = '에러: WebSocket 연결에 실패했습니다.';
                stopStreaming();
            };
        }

        function stopStreaming() {
            if (intervalId) clearInterval(intervalId);
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            if (websocket) {
                websocket.close();
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            startBtn.disabled = false;
            stopBtn.disabled = true;
            describeBtn.disabled = true;
            video.srcObject = null;
            statusDiv.textContent = '상태: 대기 중';
        }

        function sendFrame() {
            if (websocket.readyState === WebSocket.OPEN) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const frame = canvas.toDataURL('image/jpeg', 0.8);
                const data = {
                    frame: frame,
                    timestamp: new Date().toISOString()
                };
                websocket.send(JSON.stringify(data));
            }
        }

        function requestObjectList() {
            if (websocket.readyState === WebSocket.OPEN) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const frame = canvas.toDataURL('image/jpeg', 0.8);
                const data = {
                    action: "list_all_objects",
                    frame: frame,
                    timestamp: new Date().toISOString()
                };
                websocket.send(JSON.stringify(data));
                statusDiv.textContent = '상태: 화면 설명을 요청했습니다...';
            } else {
                alert('스트리밍을 먼저 시작하세요.');
            }
        }

        function drawDetections(objects) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            objects.forEach(obj => {
                const { name, confidence, bbox } = obj;
                const { x, y, width, height } = bbox;
                ctx.strokeStyle = 'red';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, width, height);
                ctx.fillStyle = 'red';
                ctx.font = '16px sans-serif';
                const text = `${name} (${(confidence * 100).toFixed(1)}%)`;
                ctx.fillText(text, x, y > 10 ? y - 5 : 10);
            });
        }

        startBtn.addEventListener('click', startStreaming);
        stopBtn.addEventListener('click', stopStreaming);
        describeBtn.addEventListener('click', requestObjectList);
    </script>
</body>
</html>
