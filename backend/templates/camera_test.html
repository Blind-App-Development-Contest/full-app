<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>웹캠 실시간 객체 탐지 테스트</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        #container { position: relative; margin-top: 20px; }
        #video { border: 1px solid black; }
        #canvas { position: absolute; top: 0; left: 0; }
        #controls { margin-top: 10px; }
        #status { margin-top: 10px; font-size: 14px; color: #333; }
    </style>
</head>
<body>
    <h1>웹캠 실시간 객체 탐지 테스트</h1>
    <div id="controls">
        <label for="user_id">User ID:</label>
        <input type="text" id="user_id" placeholder="DB에 있는 유효한 UUID 입력">
        <button id="startBtn">테스트 시작</button>
        <button id="stopBtn" disabled>중지</button>
    </div>
    <div id="status">상태: 대기 중</div>
    <div id="threat_level_display">현재 위험도: -</div>
    <div id="container">
        <video id="video" width="640" height="480" autoplay muted playsinline></video>
        <canvas id="canvas" width="640" height="480"></canvas>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const userIdInput = document.getElementById('user_id');
        const statusDiv = document.getElementById('status');

        let websocket;
        let stream;
        let intervalId;

        // --- WebSocket 및 스트리밍 로직 ---
        async function startStreaming() {
            const userId = userIdInput.value.trim();
            if (!userId) {
                alert('User ID를 입력하세요.');
                return;
            }

            // 1. 웹캠 스트림 가져오기
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                statusDiv.textContent = '상태: 웹캠 로드 완료. WebSocket 연결 중...';
            } catch (err) {
                console.error("웹캠 접근 에러:", err);
                statusDiv.textContent = '에러: 웹캠에 접근할 수 없습니다.';
                return;
            }

            // 2. WebSocket 연결
            const wsUrl = `ws://${window.location.host}/api/camera/stream/${userId}`;
            console.log("Connecting to WebSocket:", wsUrl); // 디버깅용 로그 추가
            websocket = new WebSocket(wsUrl);

            websocket.onopen = () => {
                console.log("WebSocket 연결 성공");
                statusDiv.textContent = '상태: 연결됨. 실시간 탐지 중...';
                startBtn.disabled = true;
                stopBtn.disabled = false;

                // 3. 1초에 5번 (200ms 마다) 프레임 전송
                intervalId = setInterval(() => {
                    sendFrame();
                }, 200);
            };

            websocket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.status === 'processed') {
                    // 4. 탐지 결과 그리기
                    if (data.objects) {
                        drawDetections(data.objects);
                    }

                    // 5. 진동 처리 및 상태 업데이트
                    if (data.vibration) {
                        statusDiv.textContent = `상태: [${data.vibration.pattern_type.toUpperCase()}] ${data.vibration.reason}`;
                        // 브라우저의 진동 API 호출
                        if ('vibrate' in navigator) {
                            navigator.vibrate(data.vibration.duration_ms);
                        }
                    } else {
                        statusDiv.textContent = '상태: 연결됨. 실시간 탐지 중...';
                    }

                } else if (data.status === 'error') {
                    console.error("서버 에러:", data.message);
                    statusDiv.textContent = `서버 에러: ${data.message}`;
                }

                // 위험도 숫자 표시 업데이트
                const threatLevelDisplay = document.getElementById('threat_level_display');
                if (data.highest_threat_level !== undefined) {
                    threatLevelDisplay.textContent = `현재 위험도: ${data.highest_threat_level}`;
                } else {
                    threatLevelDisplay.textContent = `현재 위험도: -`;
                }
            };

            websocket.onclose = () => {
                console.log("WebSocket 연결 종료");
                statusDiv.textContent = '상태: 연결 종료됨.';
                stopStreaming();
            };

            websocket.onerror = (err) => {
                console.error("WebSocket 에러:", err);
                statusDiv.textContent = '에러: WebSocket 연결에 실패했습니다.';
                stopStreaming();
            };
        }

        function stopStreaming() {
            if (intervalId) clearInterval(intervalId);
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            if (websocket) {
                websocket.close();
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            startBtn.disabled = false;
            stopBtn.disabled = true;
            video.srcObject = null;
            statusDiv.textContent = '상태: 대기 중';
        }

        function sendFrame() {
            if (websocket.readyState === WebSocket.OPEN) {
                // 비디오 프레임을 캔버스에 그리고 Base64로 인코딩
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const frame = canvas.toDataURL('image/jpeg', 0.8);

                const data = {
                    frame: frame,
                    timestamp: new Date().toISOString()
                };
                websocket.send(JSON.stringify(data));
            }
        }

        function drawDetections(objects) {
            // 이전 그림 지우기 (새로운 프레임은 sendFrame에서 그림)
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            objects.forEach(obj => {
                const { name, confidence, bbox } = obj;
                const { x, y, width, height } = bbox;

                // Bounding box 그리기
                ctx.strokeStyle = 'red';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, width, height);

                // Label 그리기
                ctx.fillStyle = 'red';
                ctx.font = '16px sans-serif';
                const text = `${name} (${(confidence * 100).toFixed(1)}%)`;
                ctx.fillText(text, x, y > 10 ? y - 5 : 10);
            });
        }

        startBtn.addEventListener('click', startStreaming);
        stopBtn.addEventListener('click', stopStreaming);
    </script>
</body>
</html>
