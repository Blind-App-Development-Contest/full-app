
# dev 브랜치에 푸시될 때 실행되는 워크플로우
name: Deploy to Azure (Dev)

on:
  push:
    branches:
      - dev

env:
  # TODO: 본인 환경에 맞게 수정하세요.
  AZURE_WEBAPP_NAME: your-azure-webapp-name    # Azure Web App 이름
  AZURE_REGISTRY_NAME: your-azure-registry     # Azure Container Registry(ACR) 이름
  IMAGE_NAME: ${{ secrets.AZURE_REGISTRY_NAME }}/backend-dev:${{ github.sha }}

jobs:
  build-and-push:
    name: "Docker 이미지 빌드 및 푸시"
    runs-on: ubuntu-latest

    steps:
      - name: "코드 체크아웃"
        uses: actions/checkout@v3

      - name: "Azure CLI 로그인"
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }} # GitHub 시크릿에 저장된 Azure 서비스 주체

      - name: "ACR(Azure Container Registry) 로그인"
        run: |
          az acr login --name $AZURE_REGISTRY_NAME

      - name: "Docker 이미지 빌드"
        working-directory: ./backend
        run: |
          docker build -t $IMAGE_NAME .

      - name: "Docker 이미지 ACR에 푸시"
        run: |
          docker push $IMAGE_NAME

  deploy:
    name: "Azure Web App에 배포"
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: "Azure CLI 로그인"
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "Azure Web App에 배포"
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ env.IMAGE_NAME }}

      - name: "배포 후 ACR에서 사용하지 않는 이미지 정리 (선택 사항)"
        run: |
          az acr repository show-manifests --name $AZURE_REGISTRY_NAME --repository backend-dev --query "[?tags==null].digest" -o tsv | xargs -I% az acr repository delete --name $AZURE_REGISTRY_NAME --image backend-dev@% --yes

